design:
  theme: engineeringresumes
  page:
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.5in
    right_margin: 0.5in
    show_top_note: false
  typography:
    alignment: left
    line_spacing: 0.45em
    font_size:
      body: 10pt
      name: 22pt
  header:
    space_below_name: 0.3cm
    space_below_connections: 0.3cm
  section_titles:
    space_above: 0.28cm
    space_below: 0.2cm
  sections:
    space_between_regular_entries: 0.25cm
    space_between_text_based_entries: 0.1cm
  entries:
    date_and_location_width: 3.6cm
    highlights:
      space_above: 0.05cm
      space_between_items: 0.05cm
  templates:
    experience_entry:
      main_column: "**POSITION**, COMPANY -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
    normal_entry:
      main_column: "**NAME** -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: DATE
locale:
  language: english
  present: Present
settings:
  current_date: today
  render_command:
