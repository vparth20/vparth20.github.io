  sections:
    experience:
    - company: Tesla, Inc.
      position: Manufacturing Equipment Engineer, LFP Cell (Megapack)
      location: Sparks, NV
      start_date: 2025-08
      end_date: present
      highlights:
      - Raised yield 10% and availability 4% on 24 winders by retrofitting SOS servo drives through safety PLCs and relays to hold web tension and hot-knife power when safety doors open
      - Raised winder availability ~6.6% by rezoning safety guarding for live pancake loading on idle unwinders, designing doors, integrating Keyence interlocks and request-to-enter controls, and leading the safety re-buyoff
      - Qualified 12 winders to 95% availability and 85% FPY, plus 8 jelly-roll shaping machines, through PLC machine-function, error-proofing, and cold-press and hipot linearity-bias tests
      - Commissioned 4 calendaring tools, configuring PLC and IPC networking for MES connectivity, and debugging faults through production release
      - Raised availability 2% on 4 calendaring tools by validating Omron PLC OEE state reporting with SQL scripts, adding fault reason codes and HMI downtime prompts, and eliminating the top Pareto faults
      - Cut JR inspection cycle time 2 s, raising throughput from 6.3 to 8 PPM, by modifying PLC pallet pre-stop logic to stage the next pallet early and designing an SLA-printed go/no-go gauge for tab alignment
      - Root-caused a P1 mother-roll fall near miss to a 110 vs 120 cm core mismatch, then designed, sourced, and installed extended rack fixture blocks that hard-stop core over-travel, with zero recurrence
    - company: SRG Global (Koch Industries)
      position: Manufacturing Automation Engineer, Robotics
      location: Covington, GA
      start_date: 2024-07
      end_date: 2025-08
      highlights:
      - Cut EOAT changeover time 60% with an automatic tool changer and designed 4 EOATs with pneumatics and part-presence sensing, simulating each cell in ROBOGUIDE to program and validate FANUC paths and payloads
      - Raised FPY from 96% to 98% on a FANUC 6-axis demolding and de-gating cell by tuning EOAT pneumatic pressure, refining robot pick paths, and reprogramming part-specific gate cut angles to protect Class A surfaces
      - Automated short-shot inspection with Keyence IV4 cameras wired to FANUC digital I/O to route rejects, removing one inspector per shift with zero customer escapes
      - Cut scrap cost 20% by deploying Keyence laser marking with AI-camera read verification on polycarbonate parts, plus an Ignition HMI retry sequence for failed reads
    - company: Tesla, Inc.
      position: Manufacturing Equipment Engineer, Drive Unit
      summary: Co-op Jan–Aug 2023, returned full-time Jan–Apr 2024 (12 months total)
      location: Sparks, NV
      start_date: 2023-01
      end_date: 2024-04
      highlights:
      - Owned 15+ production machines on the final assembly line building 20,000 drive units per week
      - Cut 20% weekly rotor-stator press scrap from gantry crashes after a stator part-type change by adding a Studio 5000 PLC step that parks the gantry in a safe position until parts exit the station
      - Eliminated a 38% scrap-count increase at the vision station by adding the pre-stop pallet release to the station interlocks in the Allen-Bradley PLC logic, stopping the robot from crashing into parts
      - Commissioned PLC logic for a new gear-case load conveyor and assisted with SAT in a 4-day downtime window, reviewing logic and troubleshooting RFID and part-presence faults to ramp production to 20,000 drive units per week
      - Restored spin and flash station yield 0.8% to 99% FPY during an NPI oil-pump cutover by flagging LPM spikes and aligning Quality, Design Engineering, and other-site test teams on pump cavitation as the root cause
    skills:
